name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r server/requirements.txt -r server/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: server

  agent-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build agent/OpenDLP.Agent.csproj -c Release
      - run: dotnet build watchdog/OpenDLP.Watchdog.csproj -c Release
      - run: dotnet test agent.tests/OpenDLP.Agent.Tests.csproj -c Release --logger "console;verbosity=normal"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t opendlp-server .
