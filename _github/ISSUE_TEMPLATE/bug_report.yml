name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, description: "Steps to reproduce, expected vs. actual. No secrets or personal data."}
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: Environment, placeholder: "OS, .NET / Python version, OpenDLP version"}
