name: Release
# Push a tag like v0.8.0 to build the Windows binaries and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish agent
        run: dotnet publish agent/OpenDLP.Agent.csproj -c Release -r win-x64 --self-contained false -o out/agent
      - name: Publish watchdog
        run: dotnet publish watchdog/OpenDLP.Watchdog.csproj -c Release -r win-x64 --self-contained false -o out/watchdog
      - name: Bundle
        shell: pwsh
        run: |
          Copy-Item agent/agent.config.example.json out/agent/
          Copy-Item README.md,LICENSE,SECURITY.md out/
          Compress-Archive -Path out/* -DestinationPath OpenDLP-windows-${{ github.ref_name }}.zip
      - name: Checksums
        shell: pwsh
        run: (Get-FileHash OpenDLP-windows-${{ github.ref_name }}.zip -Algorithm SHA256).Hash.ToLower() + "  OpenDLP-windows-${{ github.ref_name }}.zip" | Out-File -Encoding ascii SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            OpenDLP-windows-${{ github.ref_name }}.zip
            SHA256SUMS.txt
          prerelease: true
          body: |
            **Experimental, unsigned build — not yet verified on real Windows hardware.**
            Test only on a disposable, authorized machine. See the README, SECURITY.md and CHANGELOG.md.
