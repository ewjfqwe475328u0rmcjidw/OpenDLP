<!doctype html>
<html><head><meta charset="utf-8"><title>OpenDLP extension test page</title></head>
<body>
  <textarea id="t"></textarea>
  <input type="file" id="f">
  <script>
    window.pasteSeen = 0; window.changeSeen = 0; window.lastFiles = [];
    document.getElementById("t").addEventListener("paste", () => { window.pasteSeen++; });
    document.getElementById("f").addEventListener("change", (e) => { window.changeSeen++; window.lastFiles = [...e.target.files].map(f => f.name); });
  </script>
</body></html>
