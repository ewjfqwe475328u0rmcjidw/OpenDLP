<!doctype html>
<html><head><meta charset="utf-8"><title>OpenDLP</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; min-width: 380px; color: #0b1220; }
  label { display: block; margin-top: 10px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-top: 4px; }
  button { margin-top: 12px; padding: 6px 14px; }
  .muted { color: #5b6b85; font-size: 12px; }
  #status { margin-top: 12px; padding: 8px; background: #eef3fb; border-radius: 6px; }
</style></head>
<body>
  <h3>OpenDLP browser protection</h3>
  <p class="muted" id="managed" hidden>Settings are managed by your organisation.</p>
  <label>Server URL <input id="serverUrl" placeholder="https://dlp.example.com"></label>
  <label>Enrollment code <input id="enrollmentCode" type="password"></label>
  <button id="save">Save and connect</button>
  <div id="status">…</div>
  <p class="muted">Without a server the extension uses its built-in default policy and keeps events locally.</p>
  <script src="options.js"></script>
</body></html>
