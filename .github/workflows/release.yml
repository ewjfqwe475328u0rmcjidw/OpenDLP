name: Release
# Push a tag like v0.8.0 to build the Windows binaries and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Unit tests
        run: dotnet test agent.tests/OpenDLP.Agent.Tests.csproj -c Release
      - name: Publish agent + watchdog (same layout the service E2E test installs)
        run: |
          dotnet publish agent/OpenDLP.Agent.csproj -c Release -r win-x64 --self-contained false -o out/agent
          dotnet publish watchdog/OpenDLP.Watchdog.csproj -c Release -r win-x64 --self-contained false -o out/agent
      - name: Bundle
        shell: pwsh
        run: |
          Copy-Item agent/agent.config.example.json, agent/install-service.ps1, agent/uninstall-service.ps1 out/agent/
          Copy-Item README.md, LICENSE, SECURITY.md, CHANGELOG.md out/
          Compress-Archive -Path out/* -DestinationPath OpenDLP-windows-${{ github.ref_name }}.zip
      - name: Checksums
        shell: pwsh
        run: (Get-FileHash OpenDLP-windows-${{ github.ref_name }}.zip -Algorithm SHA256).Hash.ToLower() + "  OpenDLP-windows-${{ github.ref_name }}.zip" | Out-File -Encoding ascii SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            OpenDLP-windows-${{ github.ref_name }}.zip
            SHA256SUMS.txt
          prerelease: true
          body: |
            Windows agent + watchdog (requires the .NET 8 Desktop Runtime). Unsigned build.
            Verified automatically on clean Windows VMs: build, unit tests, console and service-mode end-to-end tests.
            USB devices and the interactive clipboard are not covered by automation yet - please report results with the "Windows test report" issue template.
            Install: extract, open the `agent` folder in an elevated PowerShell, run `.\install-service.ps1 -ServerUrl https://your-server -EnrollmentCode "..." -WithWatchdog`.
