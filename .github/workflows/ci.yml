name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r server/requirements.txt -r server/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: server

  agent-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build agent
        shell: pwsh
        run: ./tools/ci/run.ps1 "dotnet build agent/OpenDLP.Agent.csproj -c Release"
      - name: Build watchdog
        shell: pwsh
        run: ./tools/ci/run.ps1 "dotnet build watchdog/OpenDLP.Watchdog.csproj -c Release"
      - name: Unit tests
        shell: pwsh
        run: ./tools/ci/run.ps1 "dotnet test agent.tests/OpenDLP.Agent.Tests.csproj -c Release --logger 'console;verbosity=normal'"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server
        run: pip install -r server/requirements.txt
      - name: End-to-end test (server + agent on a clean Windows VM)
        shell: pwsh
        run: ./tests/e2e/run-e2e.ps1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t opendlp-server .
