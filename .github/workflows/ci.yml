name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r server/requirements.txt -r server/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: server

  agent-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build agent
        shell: pwsh
        run: ./tools/ci/run.ps1 "dotnet build agent/Leakwarden.Agent.csproj -c Release"
      - name: Build watchdog
        shell: pwsh
        run: ./tools/ci/run.ps1 "dotnet build watchdog/Leakwarden.Watchdog.csproj -c Release"
      - name: Unit tests
        shell: pwsh
        run: ./tools/ci/run.ps1 "dotnet test agent.tests/Leakwarden.Agent.Tests.csproj -c Release --logger 'console;verbosity=normal'"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install server
        run: pip install -r server/requirements.txt
      - name: End-to-end test (server + agent on a clean Windows VM)
        shell: pwsh
        run: ./tests/e2e/run-e2e.ps1
      - name: Publish release layout
        shell: pwsh
        run: |
          ./tools/ci/run.ps1 "dotnet publish agent/Leakwarden.Agent.csproj -c Release -r win-x64 --self-contained true -o out/agent"
          ./tools/ci/run.ps1 "dotnet publish watchdog/Leakwarden.Watchdog.csproj -c Release -r win-x64 --self-contained true -o out/agent"
          Copy-Item agent/agent.config.example.json, agent/install-service.ps1, agent/uninstall-service.ps1 out/agent/
      - name: Service-mode end-to-end test (install, Office files, print, self-healing, uninstall)
        shell: pwsh
        run: ./tests/e2e/run-service-e2e.ps1 -Publish out/agent

  agent-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - name: Build agent (macOS / Linux)
        shell: pwsh
        run: ./tools/ci/run.ps1 "dotnet build agent-unix/Leakwarden.Agent.Unix.csproj -c Release"
      - name: Install Tesseract OCR (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - name: End-to-end test (console)
        shell: pwsh
        env:
          LEAKWARDEN_E2E_OCR: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: ./tests/e2e/run-e2e.ps1 -AgentExe agent-unix/bin/Release/net8.0/leakwarden-agent
      - name: Publish release layout
        shell: pwsh
        run: |
          ./tools/ci/run.ps1 "dotnet publish agent-unix/Leakwarden.Agent.Unix.csproj -c Release -r $env:RID --self-contained true -p:PublishSingleFile=true -o out/unix"
          Copy-Item agent-unix/install.sh, agent-unix/uninstall.sh out/unix/
      - name: Service-mode end-to-end test (install.sh, launchd/systemd restart, uninstall)
        shell: pwsh
        run: ./tests/e2e/run-unix-service-e2e.ps1 -Publish out/unix

  browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - name: Install Playwright + Chromium
        working-directory: browser-extension
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Detector tests (shared vectors)
        working-directory: browser-extension
        run: npm test
      - name: End-to-end test in Chromium (enroll, signed policy, block/allow paste and upload, fingerprints)
        run: node browser-extension/test/e2e.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t leakwarden-server .
