name: Deploy Kit - interest
description: Tell us you'd want the paid Leakwarden Deploy Kit
title: "[Deploy Kit] interest"
labels: ["deploy-kit-interest"]
body:
  - type: markdown
    attributes:
      value: |
        The Deploy Kit is tooling that installs and rolls out Leakwarden on **your own** server. No hosting, no access
        to your data, no support service. See the README for prices and terms. Nothing to pay now.

        **This issue is public.** Don't post your company name, logs, policies, alerts or anything confidential.
  - type: dropdown
    id: size
    attributes:
      label: How many computers would you protect?
      options: ["1-25", "26-100", "101-500", "500+"]
    validations: {required: true}
  - type: dropdown
    id: role
    attributes:
      label: You are...
      options: ["IT for my own company", "MSP / IT service provider for several clients", "Security consultant", "Just evaluating"]
    validations: {required: true}
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      options:
        - label: Windows
        - label: macOS
        - label: Linux
  - type: dropdown
    id: price
    attributes:
      label: Would the listed price work for you?
      options: ["Yes", "Yes, if billed yearly", "Too expensive", "I'd pay more for more (tell us below)"]
  - type: textarea
    id: needs
    attributes:
      label: What would make the kit worth paying for?
      description: e.g. your cloud provider, your device-management tool (Intune, Jamf, ...), your industry for policy presets
