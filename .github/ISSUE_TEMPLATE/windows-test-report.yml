name: Windows test report
description: Report the result of testing the Agent on a Windows machine
labels: ["testing"]
body:
  - type: markdown
    attributes:
      value: |
        Please test only on an authorized, disposable machine. **Do not paste secrets, tokens, personal data or sensitive logs.**
  - type: input
    id: os
    attributes: {label: Windows version, placeholder: "Windows 11 23H2 x64"}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Leakwarden version / release tag, placeholder: "v0.8.0"}
    validations: {required: true}
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options: ["Builds and runs", "Builds but fails at runtime", "Does not build", "Partially works"]
    validations: {required: true}
  - type: textarea
    id: details
    attributes:
      label: What did you test and what happened?
      description: File monitoring, content detection, USB, clipboard, print, policy sync, service mode, helper IPC…
    validations: {required: true}
